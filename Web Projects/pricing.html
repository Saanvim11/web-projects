<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pricing Table</title>
    <style>
        .pricing-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 2rem;
        }

        .pricing-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 250px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .pricing-card:hover {
            transform: scale(1.05);
        }

        .pricing-card.popular {
            border: 2px solid #3498db;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.3);
        }

        .popular-badge {
            background-color: #3498db;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 2rem;
            color: #2ecc71;
            margin: 15px 0;
        }

        .features {
            list-style-type: none;
            padding: 0;
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .pricing-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="pricing-container">
        <div class="pricing-card">
            <h2>Basic</h2>
            <div class="price">Rs9.99</div>
            <ul class="features">
                <li>Feature 1</li>
                <li>Feature 2</li>
            </ul>
            <button class="btn">Choose Plan</button>
        </div>
        <div class="pricing-card popular">
            <div class="popular-badge">Most Popular</div>
            <h2>Pro</h2>
            <div class="price">Rs19.99</div>
            <ul class="features">
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
            </ul>
            <button class="btn">Choose Plan</button>
        </div>
        <div class="pricing-card">
            <h2>Enterprise</h2>
            <div class="price">Rs29.99</div>
            <ul class="features">
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
                <li>Feature 4</li>
            </ul>
            <button class="btn">Choose Plan</button>
        </div>
    </div>
</body>
</html>
